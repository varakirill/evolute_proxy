  - sensor:
      - name: "Evolute Signal Level"
        unique_id: evolute_signalLevel
        state: "{{ state_attr('sensor.evolute_raw_data', 'signalLevel') }}"
        unit_of_measurement: "%"
        icon: mdi:signal
        state_class: measurement
      - name: "Evolute 12VBattery Voltage"
        unique_id: evolute_12vbattery_voltage
        state: "{{ state_attr('sensor.evolute_raw_data', '12VBatteryVoltage') }}"
        unit_of_measurement: "V"
        icon: mdi:battery
        state_class: measurement

      - name: "Evolute Battery Percentage"
        unique_id: evolute_battery_percentage
        state: "{{ state_attr('sensor.evolute_raw_data', 'batteryPercentage') }}"
        unit_of_measurement: "%"
        icon: mdi:battery
        state_class: measurement

      - name: "Evolute Remaining Mileage (Fuel)"
        unique_id: evolute_remains_mileage_fuel
        state: "{{ state_attr('sensor.evolute_raw_data', 'remainsFuelMileage') }}"
        unit_of_measurement: "km"
        icon: mdi:gas-station
        state_class: measurement

      - name: "Evolute Remaining Mileage (Battery)"
        unique_id: evolute_remains_mileage_battery
        state: "{{ state_attr('sensor.evolute_raw_data', 'remainsBatteryMileage') }}"
        unit_of_measurement: "km"
        icon: mdi:map-marker-distance
        state_class: measurement

      - name: "Evolute Outside Temperature"
        unique_id: evolute_outside_temp
        state: "{{ state_attr('sensor.evolute_raw_data', 'outsideTemp') }}"
        unit_of_measurement: "°C"
        icon: mdi:thermometer
        state_class: measurement

      - name: "Evolute Fuel Percentage"
        unique_id: evolute_fuel_percentage
        state: "{{ state_attr('sensor.evolute_raw_data', 'fuelPercentage') }}"
        unit_of_measurement: "%"
        icon: mdi:fuel
        state_class: measurement

      - name: "Evolute Battery Temperature"
        unique_id: evolute_battery_temp
        state: "{{ state_attr('sensor.evolute_raw_data', 'batteryTemp') }}"
        unit_of_measurement: "°C"
        icon: mdi:thermometer
        state_class: measurement

      - name: "Evolute Coolant Temperature"
        unique_id: evolute_coolant_temp
        state: "{{ state_attr('sensor.evolute_raw_data', 'coolantTemp') }}"
        unit_of_measurement: "°C"
        icon: mdi:coolant-temperature
        state_class: measurement

      - name: "Evolute Inboard Temperature"
        unique_id: evolute_inboard_temp
        state: "{{ state_attr('sensor.evolute_raw_data', 'inBoardTemp') }}"
        unit_of_measurement: "°C"
        icon: mdi:thermometer-lines
        state_class: measurement

      - name: "Evolute Odometer"
        unique_id: evolute_odometer
        state: "{{ state_attr('sensor.evolute_raw_data', 'odometer') }}"
        unit_of_measurement: "km"
        icon: mdi:rotate-right
        state_class: total_increasing

      - name: "Evolute Climate Fan Speed"
        unique_id: evolute_climate_fan_speed
        state: "{{ state_attr('sensor.evolute_raw_data', 'climateFanSpeed') }}"
        unit_of_measurement: "Level"
        icon: mdi:fan
        state_class: measurement

      - name: "Evolute Climate Target Temp"
        unique_id: evolute_climate_target_temp
        state: "{{ state_attr('sensor.evolute_raw_data', 'climateTargetTemp') }}"
        unit_of_measurement: "°C"
        icon: mdi:thermometer
        state_class: measurement

      - name: "Evolute Online State"
        unique_id: evolute_online_state
        state: "{{ state_attr('sensor.evolute_raw_data', 'onlineState') }}"
        icon: mdi:cloud-check

      - name: "Evolute Car State Updated At"
        unique_id: evolute_car_state_updated_at
        state: >-
          {% set ts = state_attr('sensor.evolute_raw_data', 'carStateUpdatedAt') | int(0) %}
          {{ (ts / 1000) | timestamp_local if ts > 0 else 'unavailable' }}
        device_class: timestamp
        icon: mdi:clock-check-outline

      - name: "Evolute Position Updated At"
        unique_id: evolute_position_updated_at
        state: >-
          {% set ts = state_attr('sensor.evolute_raw_data', 'positionAt') | int(0) %}
          {{ (ts / 1000) | timestamp_local if ts > 0 else 'unavailable' }}
        device_class: timestamp
        icon: mdi:map-clock

      - name: "Evolute GPS Course"
        unique_id: evolute_gps_course
        state: "{{ state_attr('sensor.evolute_raw_data', 'course') }}"
        unit_of_measurement: "°"
        icon: mdi:compass
        state_class: measurement

      - name: "Evolute Latitude"
        unique_id: evolute_latitude
        state: "{{ state_attr('sensor.evolute_raw_data', 'lat') | float }}"
        icon: mdi:latitude

      - name: "Evolute Longitude"
        unique_id: evolute_longitude
        state: "{{ state_attr('sensor.evolute_raw_data', 'lon') | float }}"
        icon: mdi:longitude

      - name: "Evolute Car Location"
        unique_id: evolute_car_location
        state: >-
          {% set lat = state_attr('sensor.evolute_raw_data', 'lat') %}
          {% set lon = state_attr('sensor.evolute_raw_data', 'lon') %}
          {% if lat is not none and lon is not none %}
            {{ lat | float }}, {{ lon | float }}
          {% else %}
            unknown
          {% endif %}
        icon: mdi:map-marker

  - binary_sensor:
      - name: "Evolute Ignition On"
        unique_id: evolute_ignition_on
        state: "{{ state_attr('sensor.evolute_raw_data', 'isIgnitionOn') | bool(false) }}"
        device_class: power
        icon: mdi:engine

      - name: "Evolute Central Locking Engaged"
        unique_id: evolute_central_locking
        state: "{{ not (state_attr('sensor.evolute_raw_data', 'isCentralLockingOn') | bool(false)) }}"
        device_class: lock
        icon: mdi:lock

      - name: "Evolute Ready Status"
        unique_id: evolute_ready_status
        state: "{{ state_attr('sensor.evolute_raw_data', 'isCarStateReady') in [true, 'true', 'True', 1, '1'] }}"
        device_class: plug
        icon: mdi:car-electric

      - name: "Evolute Charging Gun Inserted"
        unique_id: evolute_charging_gun_inserted
        state: "{{ state_attr('sensor.evolute_raw_data', 'isChargingGunInserted') | bool(false) }}"
        icon: mdi:ev-plug-type2

      - name: "Evolute Door Front Left Open"
        unique_id: evolute_door_fl_open
        state: "{{ state_attr('sensor.evolute_raw_data', 'doorFLStatus') | int == 1 }}"
        device_class: door
        icon: mdi:car-door

      - name: "Evolute Door Front Right Open"
        unique_id: evolute_door_fr_open
        state: "{{ state_attr('sensor.evolute_raw_data', 'doorFRStatus') | int == 1 }}"
        device_class: door
        icon: mdi:car-door

      - name: "Evolute Door Rear Left Open"
        unique_id: evolute_door_rl_open
        state: "{{ state_attr('sensor.evolute_raw_data', 'doorRLStatus') | int == 1 }}"
        device_class: door
        icon: mdi:car-door

      - name: "Evolute Door Rear Right Open"
        unique_id: evolute_door_rr_open
        state: "{{ state_attr('sensor.evolute_raw_data', 'doorRRStatus') | int == 1 }}"
        device_class: door
        icon: mdi:car-door

      - name: "Evolute Trunk Open"
        unique_id: evolute_trunk_open
        state: "{{ state_attr('sensor.evolute_raw_data', 'isTrunkOpen') | bool(false) }}"
        device_class: garage_door
        icon: mdi:car-back

      - name: "Evolute Headlights On"
        unique_id: evolute_headlights_on
        state: "{{ state_attr('sensor.evolute_raw_data', 'headLightsStatus') | int == 1 }}"
        device_class: light
        icon: mdi:car-light-high

      - name: "Evolute Parked"
        unique_id: evolute_parked
        state: "{{ state_attr('sensor.evolute_raw_data', 'isParkedOn') | bool(false) }}"
        device_class: occupancy
        icon: mdi:car-brake-parking

      - name: "Evolute Online"
        unique_id: evolute_online
        state: >-
          {% set v = state_attr('sensor.evolute_raw_data', 'isOnline') %}
          {{ v in [true, 'true', 'True', 1, '1'] }}
        device_class: connectivity
        icon: mdi:car-connected
