# Основной REST-сенсор Evolute
- resource: http://127.0.0.1:12321/sensors/all
  method: GET
  headers:
    X-API-Key: "{{ states('input_text.evolute_proxy_token') }}"
  scan_interval: 60
  sensor:
    - name: "Evolute Raw Data"
      unique_id: evolute_raw_data
      value_template: "{{ value_json.odometer | default(0) }}"
      unit_of_measurement: "km"
      icon: mdi:speedometer
      json_attributes:
        - 12VBatteryVoltage
        - batteryPercentage
        - batteryTemp
        - climateFanSpeed
        - climateTargetTemp
        - coolantTemp
        - course
        - doorFLStatus
        - doorFRStatus
        - doorRLStatus
        - doorRRStatus
        - firmwareVersion
        - fuelPercentage
        - headLightsStatus
        - inBoardTemp
        - isCentralLockingOn
        - isChargingGunInserted
        - isIgnitionOn
        - isParkedOn
        - isTrunkOpen
        - lat
        - lon
        - odometer
        - outsideTemp
        - remainsBatteryMileage
        - remainsFuelMileage
        - settingsVersion
        - signalLevel
        - trunkStatus
        - isOnline
        - onlineState
        - firmwareCheck
        - settingsCheck
        - isCarStateReady
        - carStateUpdatedAt
        - positionAt
        - warnings
